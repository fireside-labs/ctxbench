name: validate-submissions

on:
  pull_request:
    paths: ["results/**"]
  push:
    paths: ["results/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate submission schema
        run: python validate.py results/
      - name: Render leaderboard
        run: python validate.py results/ --render
      - name: Check leaderboard changed
        run: |
          git diff --exit-code LEADERBOARD.md || \
            (echo "LEADERBOARD.md out of date — run validate.py --render" && exit 1)
